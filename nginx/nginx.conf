# Rate limiting: только для auth эндпоинтов, чтобы не мешать нормальному браузингу.
# 5r/s = 5 запросов в секунду sustained; burst=30 без nodelay — лишние запросы
# задерживаются, а не отбиваются сразу. Это пропускает загрузку страницы (несколько
# запросов одновременно) и при этом защищает от brute-force перебора паролей.
limit_req_zone $binary_remote_addr zone=auth:10m rate=5r/s;

server {
    listen 80;
    server_name pewpew-test.space;

    # Let's Encrypt ACME challenge (certbot --webroot)
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name pewpew-test.space;

    ssl_certificate     /etc/letsencrypt/live/pewpew-test.space/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/pewpew-test.space/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;

    client_max_body_size 30m;

    # Docker DNS (127.0.0.11) so MinIO is re-resolved after container recreate.
    # Stale nginx upstream IP is what produced 502 on /uploads/.
    resolver 127.0.0.11 valid=10s ipv6=off;

    location /uploads/ {
        set $minio_upstream http://minio:9000;
        rewrite ^/uploads/(.*)$ /ridder/$1 break;
        proxy_pass        $minio_upstream;
        proxy_set_header  Host minio:9000;
        proxy_connect_timeout 5s;
        proxy_hide_header x-amz-id-2;
        proxy_hide_header x-amz-request-id;
        proxy_hide_header Set-Cookie;
        proxy_ignore_headers Set-Cookie;
        add_header Cache-Control "public, max-age=86400";
        proxy_intercept_errors on;
        error_page 502 503 504 = @uploads_via_app;
    }

    location @uploads_via_app {
        set $app_upstream http://app:3000;
        rewrite ^/uploads/(.*)$ /media/$1 break;
        proxy_pass         $app_upstream;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    # Rate limiting только на auth страницы (login / register / forgot-password)
    location ~* ^/[a-z][a-z]/(login|register|forgot-password)$ {
        limit_req zone=auth burst=30;
        limit_req_status 429;

        proxy_pass         http://app:3000;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade $http_upgrade;
        proxy_set_header   Connection 'upgrade';
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_buffering    off;
    }

    location / {
        proxy_pass         http://app:3000;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade $http_upgrade;
        proxy_set_header   Connection 'upgrade';
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_buffering    off;
    }
}
