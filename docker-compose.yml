services:
  peloton-ridder:
    build: .
    ports:
      - "8080:80"

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ridder
      POSTGRES_PASSWORD: ridder
      POSTGRES_DB: ridder
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: ridder
      MINIO_ROOT_PASSWORD: ridder_secret_123
    volumes:
      - miniodata:/data

volumes:
  pgdata:
  miniodata:
