# Redirect HTTP → HTTPS
server {
    listen 80;
    server_name _;

    # Let's Encrypt ACME challenge (certbot)
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS — main site
server {
    listen 443 ssl;
    server_name YOUR_DOMAIN;  # replace with actual domain, e.g. ridder.kz

    ssl_certificate     /etc/nginx/ssl/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    client_max_body_size 30m;

    # Uploaded files — proxy to MinIO bucket (public)
    # UPLOAD_URL should be https://YOUR_DOMAIN/uploads
    location /uploads/ {
        proxy_pass         http://minio:9000/ridder/;
        proxy_set_header   Host minio:9000;
        proxy_hide_header  x-amz-id-2;
        proxy_hide_header  x-amz-request-id;
        proxy_hide_header  x-amz-meta-server-side-encryption;
        proxy_hide_header  x-amz-server-side-encryption;
        proxy_hide_header  Set-Cookie;
        proxy_ignore_headers Set-Cookie;
        proxy_cache_valid  200 1d;
        add_header Cache-Control "public, max-age=86400";
    }

    # Next.js application
    location / {
        proxy_pass         http://app:3000;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade $http_upgrade;
        proxy_set_header   Connection 'upgrade';
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        # Disable buffering for server-sent events / streaming responses
        proxy_buffering    off;
    }
}
