limit_req_zone $binary_remote_addr zone=auth:10m rate=5r/s;

# HTTP
server {
    listen 80;
    server_name test.peloton-ridder.kz;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS
server {
    listen 443 ssl;
    server_name test.peloton-ridder.kz;

    ssl_certificate     /etc/letsencrypt/live/test.peloton-ridder.kz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/test.peloton-ridder.kz/privkey.pem;

    client_max_body_size 30m;

    location /uploads/ {
        proxy_pass        http://minio:9000/ridder/;
        proxy_set_header  Host minio:9000;
        proxy_hide_header x-amz-id-2;
        proxy_hide_header x-amz-request-id;
        proxy_hide_header Set-Cookie;
        proxy_ignore_headers Set-Cookie;
        add_header Cache-Control "public, max-age=86400";
    }

    location ~* ^/[a-z][a-z]/(login|register|forgot-password)$ {
        limit_req zone=auth burst=30;
        limit_req_status 429;

        proxy_pass         http://app:3000;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade $http_upgrade;
        proxy_set_header   Connection 'upgrade';
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto https;
        proxy_cache_bypass $http_upgrade;
        proxy_buffering    off;
    }

    location / {
        proxy_pass         http://app:3000;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade $http_upgrade;
        proxy_set_header   Connection 'upgrade';
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto https;
        proxy_cache_bypass $http_upgrade;
        proxy_buffering    off;
    }
}
